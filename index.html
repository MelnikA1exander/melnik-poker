<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>const ENDPOINT='https://script.google.com/macros/s/AKfycbwoHxzgV4GfROv1TEalMw502TLaDo-sVF19vnkrmIEoUWYRXHiDfpRfiYsbPBkkyYzjYw/exec'; // URL веб-приложения Apps Script (…/exec). Пусто — результаты остаются только в браузере.</script>
<title>Melnik's Poker Coach</title>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first column. Header with modes, oval felt table with seats + 5 board slots, action bar under the table, verdict + range grid after answer. */
:root{
  --bg:#E8EDEA; --surface:#FFFFFF; --sunk:#F2F5F3; --ink:#13201A; --muted:#5A6A62; --line:#D2DBD6;
  --felt:#1C5A43; --felt-2:#27705A; --rail:#2B2118; --felt-ink:#EAF5EF; --chip:#D09A2C;
  --raise:#C9502F; --call:#2E8A57; --fold:#E3E8E5; --mix:#C9962B;
  --good:#1E8A4C; --good-bg:#E1F2E7; --ok:#9A6400; --ok-bg:#FAEFD6; --bad:#B53A2E; --bad-bg:#F8E2DF;
  --card:#FFFFFF; --s-red:#C8322A; --s-blue:#2659B8; --s-green:#1F7A3E; --s-black:#1A1A1A;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --sunk:#111915; --ink:#E4EDE8; --muted:#93A49B; --line:#29372F;
  --felt:#15402F; --felt-2:#1D5240; --rail:#1C150F; --felt-ink:#E3F2EA; --chip:#DCAA45;
  --raise:#E06A47; --call:#4CB57A; --fold:#25312B; --mix:#D9A940;
  --good:#5CC98A; --good-bg:#15301F; --ok:#E2B04F; --ok-bg:#33280F; --bad:#EE7B6E; --bad-bg:#3A1A16;
  --card:#F3F3EF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --sunk:#111915; --ink:#E4EDE8; --muted:#93A49B; --line:#29372F;
  --felt:#15402F; --felt-2:#1D5240; --rail:#1C150F; --felt-ink:#E3F2EA; --chip:#DCAA45;
  --raise:#E06A47; --call:#4CB57A; --fold:#25312B; --mix:#D9A940;
  --good:#5CC98A; --good-bg:#15301F; --ok:#E2B04F; --ok-bg:#33280F; --bad:#EE7B6E; --bad-bg:#3A1A16;
  --card:#F3F3EF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 40px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 16px}
h1{font:700 20px/1.15 var(--f-display);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:500 11px/1.4 var(--f-body);color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.score{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.score b{color:var(--ink)}
.seg{display:flex;gap:3px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;font:600 13px var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 6px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg button:disabled,.seg button.locked{cursor:not-allowed;opacity:.55}
.soon{font:600 9px var(--f-body);text-transform:uppercase;letter-spacing:.06em;background:var(--line);color:var(--muted);padding:1px 5px;border-radius:4px}
.wrap>*{min-width:0}
#modes{overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.soon.beta{background:color-mix(in srgb,var(--chip) 30%,transparent);color:var(--ok);text-transform:none}
.controls{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.controls .seg{flex:1 1 260px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chipf{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sizesel{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sizesel select{font:500 13px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--chip);outline-offset:2px}

/* ---- table ---- */
.table-wrap{position:relative;width:100%;aspect-ratio:16/10.5;max-width:100%}
.rail{position:absolute;inset:7% 6% 9% 6%;border-radius:999px;background:var(--rail);padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.felt{width:100%;height:100%;border-radius:999px;background:radial-gradient(110% 90% at 50% 40%, var(--felt-2), var(--felt) 72%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--felt-ink)}
.board{display:flex;gap:5px}
.potline{font:600 12px var(--f-mono);background:rgba(0,0,0,.28);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.pc{width:38px;height:53px;border-radius:6px;background:var(--card);display:grid;place-items:center;font:700 16px/1 var(--f-display);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.pc span{display:block;text-align:center;line-height:1}
.pc i{font-style:normal;display:block;font-size:15px;margin-top:2px}
.pc.slot{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.pc.big{width:46px;height:64px;font-size:19px}.pc.big i{font-size:18px}
.pc.h{color:var(--s-red)}.pc.d{color:var(--s-blue)}.pc.c{color:var(--s-green)}.pc.s{color:var(--s-black)}
.pc.back{background:repeating-linear-gradient(45deg,#7d2d22 0 4px,#9a3a2c 4px 8px);box-shadow:0 0 0 2px #f4efe6 inset,0 2px 0 rgba(0,0,0,.28)}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;z-index:2}
.seat .pod{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:3px 6px;text-align:center;min-width:62px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seat .pos{font:700 11px var(--f-body);letter-spacing:.03em}
.seat .pp{font:500 10px var(--f-body);color:var(--muted);line-height:1.2}
.seat .stk{font:500 11px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.seat.folded{opacity:.38}
.seat.acted .pod{border-color:var(--raise);box-shadow:0 0 0 2px color-mix(in srgb,var(--raise) 35%,transparent)}
.seat.hero{width:auto;z-index:3}
.seat.hero .pod{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seat.hero .stk{color:inherit;opacity:.75}
.seat .mini{display:flex;gap:2px;margin-bottom:1px}
.seat .mini .pc{width:16px;height:22px;border-radius:3px}
.hand{display:flex;gap:4px;margin-bottom:2px}
.bet{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--f-mono);color:var(--felt-ink);display:flex;align-items:center;gap:4px;z-index:1;white-space:nowrap}
.bet::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 1px 0 rgba(0,0,0,.3)}
.dealer{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:#F7F4EC;color:#1a1a1a;font:700 10px var(--f-body);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.35);z-index:1}
.log{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.log b{color:var(--ink);font-weight:600}

/* ---- actions ---- */
#panel{display:grid;gap:8px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{font:700 15px var(--f-body);border:0;border-radius:12px;padding:14px 6px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:56px;justify-content:center}
.act small{font:500 11px var(--f-mono);opacity:.85}
.act.fold{background:#6B7570}.act.check{background:#4F6B8A}.act.call{background:var(--call)}.act.raise{background:var(--raise)}
.act:disabled{opacity:.3;cursor:not-allowed}
.act[aria-expanded="true"]{box-shadow:0 0 0 3px color-mix(in srgb,var(--raise) 40%,transparent)}
.kbd{font:500 10px var(--f-mono);opacity:.6}
.raisebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
.presets button small{font:500 11px var(--f-mono);color:var(--muted);margin-left:4px}
.amount{display:flex;gap:8px;align-items:center}
.amtlbl{font:600 14px var(--f-body);margin-right:auto;white-space:nowrap}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:2px 0;background:transparent;cursor:pointer;touch-action:none;--fill:0%}
#slider:focus{outline:none}
#slider::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(to right,var(--raise) 0,var(--raise) var(--fill),var(--line,#8884) var(--fill));box-shadow:inset 0 0 0 1px #0002}
#slider::-moz-range-track{height:12px;border-radius:6px;background:var(--line,#8884);box-shadow:inset 0 0 0 1px #0002}
#slider::-moz-range-progress{height:12px;border-radius:6px;background:var(--raise)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-10px;border-radius:50%;background:var(--raise);border:4px solid var(--surface);box-shadow:0 2px 6px #0006}
#slider::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--raise);border:4px solid var(--surface);box-shadow:0 2px 6px #0006}
#slider:active::-webkit-slider-thumb,#slider:focus-visible::-webkit-slider-thumb{transform:scale(1.15)}
#slider:active::-moz-range-thumb,#slider:focus-visible::-moz-range-thumb{transform:scale(1.15)}
.slscale{display:flex;justify-content:space-between;font:600 11px 'JetBrains Mono',monospace;color:var(--muted,#888);margin-top:-6px}
.amount input[type=number]{width:96px;text-align:center;font:600 16px var(--f-mono);padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink)}
.step{font:700 16px var(--f-body);width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.confirm{font:700 15px var(--f-body);border:0;border-radius:12px;padding:13px;background:var(--raise);color:#fff;cursor:pointer}
.hint{font-size:12px;color:var(--muted)}

/* ---- hand flow ---- */
.seat .mini .pc.up{width:24px;height:33px;font-size:11px;border-radius:4px}.seat .mini .pc.up i{font-size:10px;margin-top:1px}
.seat .stk.tagline{color:var(--raise);font-weight:600;font-family:var(--f-body)}
.seat.hero .stk.tagline{color:inherit}
.seat.turn .pod{box-shadow:0 0 0 2px var(--chip)}
.seat .pod{position:relative}
.actb{position:absolute;top:100%;left:50%;transform:translate(-50%,4px);white-space:nowrap;font:700 11px/1 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:4;pointer-events:none}
.actb.r{background:var(--raise);border-color:var(--raise);color:#fff}
.actb.c{background:var(--call);border-color:var(--call);color:#fff}
.actb.f{background:var(--fold);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.actb.new{animation:pop .28s ease-out}@keyframes pop{0%{transform:translate(-50%,4px) scale(.4);opacity:0}70%{transform:translate(-50%,4px) scale(1.12);opacity:1}100%{transform:translate(-50%,4px) scale(1)}}}
@media (max-width:519px){.actb{font-size:10px;padding:3px 6px}}
.sumrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dec{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.dechead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.decn{font:700 13px var(--f-display)}
.ctx{font-size:13px;color:var(--muted)}
.gridblock{display:grid;gap:8px}
.potline,.board,.prog{position:relative;z-index:1}
.backbtn{position:absolute;left:0;top:0;z-index:6;font:600 12px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.backbtn:hover{background:var(--sunk)}
.prog{display:grid;gap:3px;justify-items:center;font:600 12px var(--f-body);color:#fff}
.prog i{display:block;width:96px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
.prog i b{display:block;height:100%;background:#fff}
/* ---- help ---- */
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.helpbtn{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.help h3{font:700 13px var(--f-display);margin:6px 0 0}
.help p,.help li{margin:0;max-width:62ch;font-size:14px}
.help ul{margin:0;padding-left:18px;display:grid;gap:4px}
/* ---- equity ---- */
.eq{align-self:center;font:700 12px var(--f-mono);background:var(--chip);color:#1b1405;padding:2px 6px;border-radius:6px;margin-left:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.seat>.eq{font-size:11px;padding:1px 5px;margin:0 0 1px}
.seat.hero>.eq{font-size:12px;padding:2px 7px}
/* ---- range sheet ---- */
.plus{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font:700 15px/1 var(--f-body);display:grid;place-items:center;cursor:pointer;padding:0;align-self:center;margin-left:3px}
.hand,.seat .mini{position:relative}
.hand .plus,.seat .mini .plus{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);margin:0;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.seat .mini .plus{width:18px;height:18px;font-size:13px;bottom:-5px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
.sheetcard{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));display:grid;gap:10px}
.sheethead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheetcard p{margin:0}
.xbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;flex:none}
.grid .W1{background:var(--raise);color:#fff}
.grid .Wp,.lgp{background:color-mix(in srgb,var(--raise) 40%,var(--fold));color:var(--ink)}
.lgp{display:inline-block}
@media (min-width:600px){.sheet{align-items:center}.sheetcard{border-radius:16px}}
/* ---- verdict ---- */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.pill{display:inline-block;font:600 12px var(--f-body);padding:3px 10px;border-radius:999px}
.pill.g2{background:var(--good-bg);color:var(--good)}.pill.g1{background:var(--ok-bg);color:var(--ok)}.pill.g0{background:var(--bad-bg);color:var(--bad)}
.verdict p{margin:0;max-width:65ch}
.verdict .you{font-size:13px;color:var(--muted)}
.gto{font:600 15px var(--f-body)}
.startbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font:700 17px var(--f-body);background:var(--raise);color:#fff;border:0;border-radius:14px;padding:16px 34px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.startbtn:hover{filter:brightness(1.08)}
.whobtn{font:500 13px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(300px,86%);box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px}
.namebox label{font:600 15px var(--f-body);color:var(--ink)}
.namebox input{font:500 16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg,#fff);color:var(--ink)}
.namebox button{font:700 16px var(--f-body);background:var(--raise);color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer}
.namebox button:disabled{opacity:.45;cursor:default}
.namebox .hint{margin:0}
.res{display:grid;gap:12px}
.gtobar{display:grid;gap:6px}
.gtohead{display:flex;justify-content:space-between;align-items:baseline;font:600 14px var(--f-body)}
.gtohead b{font:700 20px var(--f-mono)}
.gtotrack{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.gtotrack i{display:block;height:100%;background:linear-gradient(90deg,var(--bad,#c33),var(--mix),var(--call))}
.gtobar .hint{margin:0}
.ptype{font:700 22px/1.2 var(--f-head,var(--f-body));margin:0}
.psub{font-size:13px;color:var(--muted);margin:2px 0 0}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.pstats div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.pstats b{display:block;font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.pstats span{font-size:12px;color:var(--muted)}
.tips{margin:0;padding-left:18px;display:grid;gap:6px}
.hlist{display:grid;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:26px 54px 44px 1fr auto 14px;gap:8px;align-items:center;text-align:left;font:500 13px var(--f-body);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;width:100%}
.hrow:hover{background:var(--sunk)}
.hrow .chev{color:var(--muted);font-size:12px;transition:transform .15s}
.hrow[aria-expanded="true"] .chev{transform:rotate(180deg)}
.hrow[aria-expanded="true"]{background:var(--sunk)}
.hrow .n{color:var(--muted);font:500 12px var(--f-mono)}
.hrow .hh{font:700 13px var(--f-mono)}
.hrow .sit{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdet{display:grid;gap:10px;padding:4px 0 14px;border-bottom:1px solid var(--line)}
.hdet[hidden]{display:none}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.whoon{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);z-index:5;font-size:13px;color:#fff;opacity:.85;white-space:nowrap}
.next{font:700 15px var(--f-body);background:var(--ink);color:var(--bg);border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%}
.gridwrap{overflow-x:auto;max-width:440px}
.grid{display:grid;grid-template-columns:repeat(13,minmax(22px,1fr));gap:2px;min-width:300px;font:600 10px var(--f-mono)}
.grid div{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;background:var(--fold);color:var(--muted)}
.grid .R{background:var(--raise);color:#fff}.grid .C{background:var(--call);color:#fff}
.grid .RC{background:linear-gradient(135deg,var(--raise) 50%,var(--call) 50%);color:#fff}
.grid .RF{background:linear-gradient(135deg,var(--raise) 50%,var(--fold) 50%);color:var(--ink)}
.grid .CF{background:linear-gradient(135deg,var(--call) 50%,var(--fold) 50%);color:var(--ink)}

<script>
// ===================== ranges =====================
const RANKS='AKQJT98765432';
const ri=r=>RANKS.indexOf(r);
function expand(tok){
  tok=tok.trim(); const out=[]; if(!tok) return out;
  let m;
  if((m=tok.match(/^([AKQJT2-9])\1\+$/))){ for(let i=ri(m[1]);i>=0;i--) out.push(RANKS[i]+RANKS[i]); return out; }
  if((m=tok.match(/^([AKQJT2-9])\1-([AKQJT2-9])\2$/))){ const a=ri(m[1]),b=ri(m[2]); for(let i=Math.min(a,b);i<=Math.max(a,b);i++) out.push(RANKS[i]+RANKS[i]); return out; }
  if((m=tok.match(/^([AKQJT2-9])\1$/))){ out.push(tok); return out; }
  if((m=tok.match(/^([AKQJT2-9])([AKQJT2-9])([so])\+$/))){ const a=ri(m[1]); for(let i=ri(m[2]);i>a;i--) out.push(m[1]+RANKS[i]+m[3]); return out; }
  if((m=tok.match(/^([AKQJT2-9])([AKQJT2-9])([so])-\1([AKQJT2-9])\3$/))){ const a=ri(m[2]),b=ri(m[4]); for(let i=Math.min(a,b);i<=Math.max(a,b);i++) out.push(m[1]+RANKS[i]+m[3]); return out; }
  if((m=tok.match(/^([AKQJT2-9])([AKQJT2-9])([so])$/))){ out.push(tok); return out; }
  console.warn('bad token',tok); return out;
}
const R=str=>new Set((str||'').split(',').flatMap(expand));
function chart(o){ return {R:R(o.R),C:R(o.C),RC:R(o.RC),RF:R(o.RF),CF:R(o.CF)}; }
// returns 'R','C','F','RC','RF','CF'
function cls(ch,h){ for(const k of ['RC','RF','CF']) if(ch[k].has(h)) return k; if(ch.R.has(h)) return 'R'; if(ch.C.has(h)) return 'C'; return 'F'; }
const combos=h=>h.length===2?6:(h[2]==='s'?4:12);

// Опен первым в банк. Ключ — расстояние до баттона (0 = BTN). SB отдельно.
const RFI={
  6:chart({R:'55+, A8s+, A5s-A4s, KTs+, QTs+, JTs, T9s, AJo+, KQo', RF:'44, A7s, A3s, K9s, Q9s, 98s, ATo, KJo'}),
  5:chart({R:'44+, A7s+, A5s-A3s, K9s+, Q9s+, J9s+, T9s, 98s, AJo+, KQo', RF:'33, A6s, A2s, 87s, ATo, KJo'}),
  4:chart({R:'33+, A2s+, K9s+, Q9s+, J9s+, T9s, 98s, 87s, ATo+, KJo+', RF:'22, K8s, T8s, 76s, A9o, QJo'}),
  3:chart({R:'22+, A2s+, K8s+, Q9s+, J9s+, T8s+, 97s+, 87s, 76s, ATo+, KJo+, QJo', RF:'K7s, Q8s, 65s, A9o, KTo'}),
  2:chart({R:'22+, A2s+, K6s+, Q8s+, J8s+, T8s+, 97s+, 86s+, 75s+, 65s, A9o+, KTo+, QTo+, JTo', RF:'K5s, Q7s, J7s, 54s, A8o, K9o'}),
  1:chart({R:'22+, A2s+, K3s+, Q6s+, J7s+, T7s+, 96s+, 85s+, 75s+, 64s+, 54s, A7o+, A5o, K9o+, Q9o+, J9o+, T9o', RF:'K2s, Q5s, J6s, 74s, 53s, A6o, A4o, K8o, 98o'}),
  0:chart({R:'22+, A2s+, K2s+, Q2s+, J4s+, T6s+, 95s+, 84s+, 74s+, 63s+, 53s+, 43s, A2o+, K7o+, Q8o+, J8o+, T8o+, 97o+, 87o', RF:'J2s, T5s, 94s, 73s, 52s, 42s, K6o, K5o, Q7o, J7o, T7o, 86o, 76o'}),
  SB:chart({R:'22+, A2s+, K2s+, Q4s+, J6s+, T6s+, 96s+, 85s+, 75s+, 64s+, 54s, A2o+, K8o+, Q9o+, J9o+, T9o', RF:'Q3s, Q2s, J5s, T5s, 95s, 84s, 74s, 63s, 53s, K7o, K6o, Q8o, J8o, T8o, 98o'}),
};
// Против опена: группа опенера (EP/MP/LP/SB) × место героя (IP/SB/BB). R = 3-бет.
const VSOPEN={
  'EP-IP':chart({R:'QQ+, AKs, AKo', C:'JJ-66, AQs-ATs, KQs, KJs, QJs, JTs, T9s, AQo', RC:'JJ, AQs', RF:'A5s, A4s', CF:'55, 44, KTs, 98s, AJo, KQo'}),
  'EP-SB':chart({R:'QQ+, AKs, AKo', C:'JJ-77, AQs-AJs, KQs', RC:'JJ, AQs', RF:'A5s', CF:'66, 55, ATs, KJs, QJs, JTs, AQo'}),
  'EP-BB':chart({R:'QQ+, AKs, AKo', C:'JJ-22, A2s-AQs, K9s+, Q9s+, J9s+, T8s+, 97s+, 86s+, 76s, 65s, 54s, AJo-AQo, KQo', RC:'JJ, AQs, A5s', CF:'K8s, Q8s, 75s, ATo, KJo, QJo'}),
  'MP-IP':chart({R:'JJ+, AQs+, AKo', C:'TT-44, AJs-ATs, KJs+, QJs, JTs, T9s, 98s, AQo', RC:'TT, AQs, AJs, KQs', RF:'A5s-A4s', CF:'33, 22, A9s, KTs, QTs, 87s, AJo, KQo'}),
  'MP-SB':chart({R:'JJ+, AQs+, AKo, A5s', C:'TT-66, AJs-ATs, KQs, KJs, QJs, JTs', RC:'TT, AJs, KQs, AQo', RF:'A4s', CF:'55, 44, A9s, KTs, T9s, AJo, KQo'}),
  'MP-BB':chart({R:'JJ+, AQs+, AKo', C:'TT-22, A2s-AJs, K7s+, Q8s+, J8s+, T7s+, 97s+, 86s+, 75s+, 65s, 54s, ATo-AQo, KJo+, QJo', RC:'TT, AJs, KQs, A5s-A4s, AQo', CF:'K6s, Q7s, 64s, 53s, A9o, KTo, QTo, JTo'}),
  'LP-IP':chart({R:'TT+, AJs+, AQo+, KQs, A5s-A4s', C:'99-22, ATs-A6s, KJs-KTs, QTs+, J9s+, T9s, 98s, 87s, 76s, AJo, KQo', RC:'99, ATs, KJs, AJo, KQo, A3s-A2s', CF:'K9s, Q9s, T8s, 65s, ATo, KJo, QJo'}),
  'LP-SB':chart({R:'99+, ATs+, AJo+, KJs+, QJs, A5s-A2s, KQo', C:'88-22, A9s-A6s, KTs, QTs, JTs, T9s, 98s', RC:'88, 77, A9s, KTs, ATo, KJo', CF:'66-22, K9s, J9s, 87s, 76s, QJo'}),
  'LP-BB':chart({R:'TT+, AJs+, AQo+, KQs, A5s-A4s', C:'99-22, A2s-ATs, K2s+, Q5s+, J6s+, T6s+, 96s+, 85s+, 74s+, 64s+, 53s+, 43s, A2o-AJo, K8o+, Q9o+, J9o+, T8o+, 98o, 87o', RC:'99, ATs, KJs, QJs, AJo, KQo, A3s-A2s', CF:'Q4s, J5s, 95s, 63s, 42s, K7o, Q8o, J8o, 97o, 76o'}),
  'SB-BB':chart({R:'99+, ATs+, A5s-A2s, KTs+, QJs, AJo+, KQo', C:'88-22, A9s-A6s, K2s-K9s, Q2s+, J5s+, T6s+, 95s+, 85s+, 74s+, 63s+, 53s+, 43s, A2o-ATo, K5o+, Q8o+, J8o+, T8o+, 97o+, 87o, 76o', RC:'88, 77, A9s, K9s, QTs, JTs, ATo, KJo', CF:'J4s, T5s, 84s, 52s, K4o, Q7o, J7o, 86o, 65o'}),
};
// Против 3-бета после нашего опена: группа нашего опена × позиция. R = 4-бет.
const VS3B={
  'EP-OOP':chart({R:'KK+, AKs', C:'QQ-TT, AKo, AQs, KQs', RC:'QQ, AKo', CF:'99, 88, AJs, KJs, QJs, JTs, AQo'}),
  'EP-IP':chart({R:'KK+, AKs', C:'QQ-77, AKo, AQs-AJs, KQs, KJs, QJs, JTs, T9s', RC:'QQ, AKo', RF:'A5s', CF:'66, ATs, KTs, AQo, 98s'}),
  'MP-OOP':chart({R:'KK+, AKs', C:'QQ-88, AKo, AQs-ATs, KQs, KJs, QJs, JTs', RC:'QQ, AKo', RF:'A5s-A4s', CF:'77, AQo, KTs, T9s'}),
  'MP-IP':chart({R:'KK+, AKs', C:'QQ-66, AKo, AQs-ATs, KQs-KTs, QJs, QTs, JTs, T9s, 98s, AQo', RC:'QQ, AKo', RF:'A5s-A4s', CF:'55, A9s, AJo, KQo, 87s'}),
  'LP-OOP':chart({R:'QQ+, AKs, AKo', C:'JJ-66, AQs-A9s, KQs-KTs, QJs-QTs, JTs, T9s, 98s, AQo', RC:'JJ, AQs', RF:'A5s-A3s', CF:'55, 44, A8s, AJo, KQo, 87s'}),
  'LP-IP':chart({R:'QQ+, AKs, AKo', C:'JJ-44, AQs-A7s, KQs-K9s, QJs-Q9s, JTs-J9s, T9s, T8s, 98s, 87s, 76s, AQo-AJo, KQo', RC:'JJ, AQs', RF:'A5s-A2s', CF:'33, 22, A6s, ATo, KJo, 65s'}),
};
const WIDE=RFI[0]; // «правдоподобные» руки для отбора раздач

// ===================== table / positions =====================
const LABELS={8:['UTG','UTG+1','LJ','HJ','CO','BTN','SB','BB'],9:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB','BB'],10:['UTG','UTG+1','UTG+2','MP','LJ','HJ','CO','BTN','SB','BB']};
const STACK=500, BB=4, SBA=2;
let N=9;
const lab=i=>LABELS[N][i];
const btnIdx=()=>N-3;
const dist=i=>btnIdx()-i; // 0 = BTN; для блайндов отрицательное
const isSB=i=>i===N-2, isBB=i=>i===N-1;
const rfiKey=i=>isSB(i)?'SB':Math.min(6,dist(i));
const grp=i=>isSB(i)?'SB':(dist(i)>=4?'EP':dist(i)>=2?'MP':'LP');
const grpName={EP:'ранней позиции',MP:'средней позиции',LP:'поздней позиции',SB:'малого блайнда'};

// ===================== cards =====================
const SUITS=['s','h','d','c'], SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
const rnd=n=>Math.floor(Math.random()*n);
function deal(){ const a=RANKS[rnd(13)]+SUITS[rnd(4)]; let b; do{ b=RANKS[rnd(13)]+SUITS[rnd(4)]; }while(b===a); return [a,b]; }
function hclass([a,b]){ let x=a[0],y=b[0]; if(ri(x)>ri(y)) [x,y]=[y,x]; if(x===y) return x+y; return x+y+(a[1]===b[1]?'s':'o'); }
function cardEl(code,cl=''){ const d=document.createElement('div'); if(!code){ d.className='pc slot '+cl; return d; }
  const r=code[0]==='T'?'10':code[0]; d.className=`pc ${code[1]} ${cl}`; d.setAttribute('aria-label',r+SYM[code[1]]);
  d.innerHTML=`<span>${r}<i>${SYM[code[1]]}</i></span>`; return d; }
const prettyHand=h=>h.replace(/T/g,'10');


// ===================== charts for later preflop decisions =====================
const COLD3B=chart({R:'KK+, AKs', C:'QQ-TT, AKo, AQs', RC:'QQ', CF:'99, AJs, KQs'});
const FACE4B=chart({R:'KK+, AKs', C:'QQ, AKo', RC:'AKo', CF:'JJ, AQs', RF:'A5s'});
const COLD4B=chart({R:'AA, KK'});
const FACEJAM=chart({R:'AA, KK', C:'QQ, AKs, AKo', CF:'JJ'});
const BBISO=chart({R:'99+, ATs+, KTs+, QJs, AJo+, KQo, A5s-A2s'}); // остальное — чек
const posOrder=i=>isSB(i)?0:isBB(i)?1:i+2; // порядок хода после флопа
const inPos=(p,q)=>posOrder(p)>posOrder(q);
const KIND={open:'Опен',bbiso:'BB против лимпа',vsopen:'Против опена',vs3b:'Против 3-бета',cold3b:'Колд против 3-бета',vs4b:'Против 4-бета',cold4b:'Колд против 4-бета',iso:'Изоляция лимперов',vsjam:'Против олл-ина'};
const RAISE_NAME={iso:'рейз',open:'рейз',bbiso:'рейз',vsopen:'3-бет',vs3b:'4-бет',cold3b:'4-бет',vs4b:'5-бет',cold4b:'5-бет',vsjam:'олл-ин'};

// ===================== state =====================
const KEY='pt-preflop-v2';
let S={hist:[]};
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); if(S.N) N=S.N; }catch(e){}
const save=()=>{ try{ S.N=N; localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
let filter='all', H=null, amount=0, session={n:0,pts:0,streak:0};
const $=s=>document.querySelector(s);
const ev=x=>Math.round(x/2)*2;
const inb=(x,[a,b])=>x>=a-1e-9&&x<=b+1e-9;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const bbs=x=>String(+(x/BB).toFixed(2)).replace('.',',');

// ===================== hand engine =====================
function shuffled(){ const d=[]; for(const r of RANKS) for(const s of SUITS) d.push(r+s); for(let i=d.length-1;i>0;i--){ const j=rnd(i+1); [d[i],d[j]]=[d[j],d[i]]; } return d; }
function heroSeat(){
  const ok=i=> filter==='all' || (filter==='BL'? (isSB(i)||isBB(i)) : !isSB(i)&&!isBB(i) && (filter==='EP'?dist(i)>=4:filter==='MP'?dist(i)>=2&&dist(i)<=3:dist(i)<=1));
  const c=[]; for(let i=0;i<N;i++) if(ok(i)) c.push(i); return c[rnd(c.length)];
}
function setupHand(){
  const deck=shuffled(); const players=[];
  for(let i=0;i<N;i++){ const cards=[deck.pop(),deck.pop()]; players.push({i,cards,h:hclass(cards),bet:0,folded:false,allin:false,tag:''}); }
  players[N-2].bet=SBA; players[N-1].bet=BB;
  const runout=[deck.pop(),deck.pop(),deck.pop(),deck.pop(),deck.pop()]; // борд сдаётся сразу и не меняется
  const h={players,deck,hero:heroSeat(),curBet:BB,lastRaise:BB,level:0,raisers:[],callers:0,toAct:[...Array(N).keys()],log:[],decisions:[],over:false,outcome:'',board:[],street:0,runout};
  h.openPref = Math.random()<.6?14:12; FRAMES=[];
  if(MODE==='ind') assignProfiles(h); else h.prof=Array(N).fill(null);
  snap(h);
  return h;
}
const active=h=>h.players.filter(p=>!p.folded);
function decisionFor(h,p){
  const pl=h.players[p], toCall=h.curBet-pl.bet, L=h.level;
  let ch,kind,ip=false,g=null,pos=null;
  if(L===0){ if(isBB(p)){ ch=BBISO; kind='bbiso'; } else { ch=RFI[rfiKey(p)]; kind='open'; } }
  else if(L===1){ const o=h.raisers[0]; g=grp(o); const t=isBB(p)?'BB':isSB(p)?'SB':'IP';
    ch=VSOPEN[g==='SB'?'SB-BB':`${g}-${t}`]||VSOPEN[`${g}-BB`]||VSOPEN['MP-IP']; kind='vsopen'; ip=t==='IP'; }
  else if(L===2){ const o=h.raisers[0], t3=h.raisers[1];
    if(p===o){ g=grp(o)==='SB'?'LP':grp(o); pos=inPos(p,t3)?'IP':'OOP'; ch=VS3B[`${g}-${pos}`]; kind='vs3b'; ip=pos==='IP'; }
    else { ch=COLD3B; kind='cold3b'; } }
  else if(L===3){ ch= p===h.raisers[1]?FACE4B:COLD4B; kind= p===h.raisers[1]?'vs4b':'cold4b'; }

  h.eq=null; if(ids.length<2) return;
  if(h.rng&&ids.every(i=>h.rng[i])){ const bd=h.board.map(toInt), hc=h.players[h.hero].cards.map(toInt);
    const es=eqVsLists(hc,ids.slice(1).map(i=>{ const c=h.players[i].cards; return {L:[[toInt(c[0]),toInt(c[1]),1]],tot:1}; }),bd,bd.length===5?1:8000);
    const er=eqVsLists(hc,ids.slice(1).map(i=>cum(h.rng[i])),bd,10000);
    h.eqHands={}; if(es){ h.eqHands[h.hero]=es.hero; ids.slice(1).forEach((i,k)=>h.eqHands[i]=es.vill[k]); }
    h.eqRange=er?er.hero:null; h.eqVill={}; if(er) ids.slice(1).forEach((i,k)=>h.eqVill[i]=er.vill[k]);
    h.eq=h.eqHands; return; }
  const e=equity(ids.map(i=>h.players[i].cards)); h.eqHands={}; ids.forEach((i,k)=>h.eqHands[i]=e[k]);
  const er=equityVsRanges(h.players[h.hero].cards, ids.slice(1).map(i=>lineRange(h,i).w));
  h.eqRange=er?er.hero:null; h.eqVill={}; if(er) ids.slice(1).forEach((i,k)=>h.eqVill[i]=er.vill[k]);
  h.eq=h.eqHands;
}

function presetsFor(d){

  return [2,3,4].map(m=>[Math.min(mx,ev(m*B)),'×'+m]).filter(([v])=>v<mx).concat([[mx,'олл-ин']]);
}

function rangePct(ch,keys){ let n=0; const all=new Set(); for(const k of keys) for(const hh of ch[k]) all.add(hh); for(const hh of all) n+=combos(hh); return Math.round(n/1326*100); }
function explain(x){

function explainBase(x){
  const d=x.d, c=x.c, hh=prettyHand(x.h);
  const r=rangePct(d.ch,['R','RC','RF']), cc=rangePct(d.ch,['C','RC','CF']);
  if(d.kind==='open'){
    const base=`Диапазон опена с ${lab(d.p)} ≈ ${rangePct(d.ch,['R','RF'])}% рук${isSB(d.p)?' (из SB рейз или фолд)':''}.${d.callers?' Перед тобой лимп: рейзим тем же диапазоном, размер +1 ББ за лимпера.':''}`;
    if(c==='R') return `${hh} входит в диапазон опена. ${base} Первым в банк только рейз, без лимпа.`;
    if(c==='RF') return `${hh} на границе диапазона: солвер открывает её часть времени, оба решения верны. ${base}`;
    return `${hh} за пределами диапазона. ${base}`;
  }
  if(d.kind==='bbiso') return `${hh}: ${c==='R'?'рейз на изоляцию, рука сильнее диапазона лимпа':'бесплатно смотрим флоп чеком; фолд, когда можно чекнуть, всегда ошибка'}. Из BB против лимпа рейзим ≈ ${r}% рук.`;
  const pre={R:`${hh} — ${RAISE_NAME[d.kind]}.`,C:`${hh} — колл.`,F:`${hh} — фолд.`,RC:`${hh} — микс ${RAISE_NAME[d.kind]}а и колла, верны оба.`,RF:`${hh} — пограничная: часть времени ${RAISE_NAME[d.kind]} как блеф с блокером, часть фолд.`,CF:`${hh} — пограничная: колл или фолд.`}[c];
  if(d.kind==='vsopen'){
    const who=isBB(d.p)?'BB уже вложил 4 и закрывает действие, поэтому защищается широко.':isSB(d.p)?'Из SB без позиции и с BB сзади играем туже и чаще 3-бетим, чем коллируем.':'В позиции коллируем руками, которые хорошо играют постфлоп, а 3-бетим сильные руки и часть одномастных тузов.';
    return `${pre} Против опена с ${d.op!=null?lab(d.op)+' (по чартам это группа '+grpName[d.g]+')':grpName[d.g]} ≈ ${r}% рук идут в 3-бет и ≈ ${cc}% в колл. ${who}${d.callers?' С коллерами диапазоны те же, но 3-бет крупнее на опен за каждого коллера.':''}`;

  if(d.kind==='cold3b') return `${pre} Перед тобой опен и 3-бет: оба диапазона сильные, продолжаем только премиумом. 4-бет KK+/AKs, колл QQ–TT, AKo, AQs.`;
  if(d.kind==='vs4b') return `${pre} Против 4-бета при 125 ББ продолжаем узко: олл-ин KK+/AKs, колл QQ/AKo, остальное фолд.`;

  return `${pre} Против олл-ина на 125 ББ коллируем QQ+ и AK, JJ на грани.`;
}

const LOOSE=new Set(['zak','katya','station','fish','lina']);
const MASHA_LIMP=R('A2s+, K9s+, Q9s+, J8s+, T8s+, 97s+, 86s+, 75s+, 64s+, 54s, 43s, JTo, T9o, 98o, 87o, 76o, 65o, 54o');
const STATION_V=R('22+, A2s+, A2o+, K2s+, K5o+, Q4s+, Q8o+, J6s+, J8o+, T6s+, T8o+, 96s+, 97o+, 85s+, 87o, 75s+, 76o, 64s+, 54s');

const ZAK_V=R('22+, A2s+, A7o+, K7s+, K9o+, Q8s+, Q9o+, J8s+, J9o+, T8s+, T9o, 98s, 98o, 87s, 87o, 76s, 76o, 65s, 54s');

const pickOf=a=>a[rnd(a.length)];
const prof=(h,p)=>{ const x=h.prof[p]||{name:lab(p),style:'reg'}; return REC?Object.assign({},x,{name:lab(p)}):x; }; // в записи имена профилей не показываем
const isLoose=(h,p)=>LOOSE.has(prof(h,p).style);

const minus=(a,b)=>new Set([...a].filter(x=>!b.has(x)));

// план бота: R — рейз, C — колл/лимп; рука в обоих — 50/50
function plan(h,p){
  const st=prof(h,p).style, L=h.level, pl=h.players[p], d=decisionFor(h,p), hand=pl.h, lim=h.callers;
  const E=new Set(), gto=()=>({R:uni(d.ch.R,d.ch.RC,d.ch.RF),C:uni(d.ch.C,d.ch.RC,d.ch.CF),size:null,gto:true});
  if(st==='reg') return gto();
  if(L>=3){ // против 4-бета и олл-ина
    if(st==='tema'||st==='nit'||st==='masha') return gto();
    return {R:R('AA, KK'),C:LOOSE.has(st)?R('TT+, AQs+, AQo+'):R('QQ+, AKs, AKo'),size:STACK};
  }
  if(st==='tema'){
    if(L===0){ if(isBB(p)) return {R:BBISO.R,C:E,size:16};
      const k=isSB(p)?'SB':Math.max(0,rfiKey(p)-1); return {R:uni(RFI[k].R,RFI[k].RF),C:E,size:lim?20:pickOf([12,14])}; }
    if(L===1) return {R:R('QQ+, AKs, AKo'),C:minus(uni(d.ch.C,d.ch.RC,d.ch.CF,d.ch.RF),R('QQ+, AKs, AKo')),size:pickOf([40,44,48])};
    if(p===h.raisers[0]) return {R:R('QQ+, AKs, AKo'),C:minus(uni(d.ch.C,d.ch.RC,d.ch.CF),R('QQ+, AKs, AKo')),size:ev(h.curBet*2.5)};
    return gto();
  }
  if(st==='nit'||st==='masha'){
    if(L===0){ if(isBB(p)) return {R:R('QQ+, AKs, AKo'),C:E,size:18};
      const k=isSB(p)?6:Math.min(6,rfiKey(p)+2), Rn=RFI[k].R;
      const stLimp=st==='masha'&&h.players.some((x,q)=>q!==p&&x.tag==='Лимп'&&isLoose(h,q));
      return {R:Rn,C:stLimp?minus(MASHA_LIMP,Rn):E,size:pickOf([12,14])+lim*4}; }
    if(L===1) return {R:R('QQ+, AKs, AKo'),C:R('JJ-77, AQs, AJs, KQs, AQo'),size:ev(h.curBet*3)};
    return {R:R('KK+'),C:R('QQ-TT, AKs, AKo'),size:ev(h.curBet*2.4)};
  }
  if(st==='zak'){
    if(L===0){ if(isBB(p)) return {R:R('TT+, AQs+, AQo+, KQs'),C:E,size:18};
      if(STRONG.has(hand)) return {R:STRONG,C:E,size:pickOf([32,34,36])+lim*4};
      return {R:ZAK_V,C:ZAK_V,size:pickOf([14,16])+lim*4}; }
    if(L===1) return {R:R('JJ+, AKs, AKo'),C:minus(ZAK_V,R('JJ+, AKs, AKo')),size:Math.max(30,ev(h.curBet*2.6))};
    return {R:R('KK+'),C:minus(ZAK_V,R('KK+')),size:ev(h.curBet*2.3)};
  }
  if(st==='katya'||st==='station'){
    const V=STATION_V;
    if(L===0){ if(isBB(p)) return {R:R('QQ+, AKs'),C:E,size:16};
      if(st==='katya'){ if(!V.has(hand)) return {R:E,C:E}; return {R:V,C:V,rProb:.12,size:pickOf([12,14,15,30])}; }
      return {R:STRONG,C:minus(V,STRONG),size:pickOf([14,16,18])+lim*4}; }
    if(L===1) return {R:st==='station'?R('QQ+'):E,C:st==='katya'?(h.curBet>=20?PRETTY:V):(h.curBet>=20?minus(PRETTY,R('QQ+')):minus(V,R('QQ+'))),size:ev(h.curBet*3)};
    return {R:R('AA'),C:st==='katya'?PRETTY:R('22+, A9s+, ATo+, KTs+, KJo+, QJs'),size:ev(h.curBet*2.3)};
  }
  // fish, lina
  if(L===0){ if(isBB(p)) return {R:R('QQ+'),C:E,size:16};
    if(st==='lina') return {R:LINA_OPEN,C:minus(PRETTY,LINA_OPEN),size:pickOf([8,10,12,14,15])};
    return {R:R('JJ+, AQs+, AKo'),C:PRETTY,size:pickOf([8,12,14,16])}; }
  if(L===1) return {R:R('KK+'),C:minus(h.curBet<=16?PRETTY:R('22+, A9s+, ATo+, KTs+, KJo+, QJs, JTs'),R('KK+')),size:ev(h.curBet*3)};
  return {R:R('AA, KK'),C:R('TT-QQ, AQs+, AQo+, KQs, AJs'),size:ev(h.curBet*2.3)};
}
function indBotAct(h,p){
  const pl=h.players[p], d=decisionFor(h,p), pn=plan(h,p), hand=pl.h;
  let opts=[]; if(pn.R.has(hand)&&d.canRaise) opts.push('R'); if(pn.C.has(hand)) opts.push(d.toCall>0?'C':'X');
  if(pn.R.has(hand)&&!d.canRaise&&d.toCall>0) opts.push('C');
  let a=opts.length?(opts.length===2&&pn.rProb!=null?(Math.random()<pn.rProb?'R':opts[1]):pickOf(opts)):(d.toCall>0?'F':'X');
  let amt=0; if(a==='R'){ amt=pn.size||botSize(d); if(amt>=STACK*.4) amt=STACK; amt=Math.max(d.minTo,Math.min(STACK,amt)); }
  apply(h,p,a,amt);
}

    const qp=widthOf(x.d.ch,['R','C','RC','RF','CF']), qr=widthOf(x.d.ch,['R','RC','RF']);
    const played=x.a==='C'||x.a==='R', gPlay=x.al.some(a=>a==='C'||a==='R');
    const dist= played&&gPlay ? Math.min(Math.abs(pos-qr),Math.abs(pos-qp)) : Math.abs(pos-qp);
    const close=x.al.length>1?1:1-Math.min(1,dist/.12);
    items.push({b:-2.5+4.5*close,y:x.g===2?1:x.g===1?.75:0}); }
  if(!items.length) return null;
  const sig=z=>1/(1+Math.exp(-z)); let th=0,bl=-1e18;
  for(let t=-6;t<=8;t+=.02){ let ll=-t*t/(2*2*2); for(const it of items){ const p=Math.min(.999,Math.max(.001,sig(t-it.b))); ll+=it.y*Math.log(p)+(1-it.y)*Math.log(1-p); } if(ll>bl){ bl=ll; th=t; } }
  let sc=0; const B=[]; for(let i=0;i<10;i++) B.push(-2.5+4.5*i/9); for(const b of B) sc+=sig(th-b); sc/=B.length;
  const easy=items.filter(i=>i.b<-1), hard=items.filter(i=>i.b>.5);
  return {score:sc*100,theta:th,n:items.length,easyMiss:easy.filter(i=>i.y===0).length,easyN:easy.length,hardHit:hard.filter(i=>i.y>0).length,hardN:hard.length}; }
function profAnalyze(run){

      if(gPlay&&!gFold){ D.to+=w*sev; if(!pPlay) D.t+=w*sev; }
      if(pPlay&&gPlay&&gRaise&&!gNoRaise){ D.po+=w; if(x.a==='C') D.p+=w; }
      if(pPlay&&gNoRaise&&!gRaise){ D.ao+=w; if(x.a==='R') D.a+=w; }

    mixed:{passive:'Непоследовательный, пассивный',bal:'Непоследовательный',aggr:'Непоследовательный, агрессивный'}};
  const W1={tight:'Сбрасывает часть рук, которые по GTO надо играть',ok:'Отбор рук близок к GTO',loose:'Играет заметную часть рук, которые по GTO надо сбрасывать',wild:'Играет большинство рук, которые по GTO надо сбрасывать',mixed:'Одновременно играет лишние руки и сбрасывает хорошие, то есть выбирает не те руки'}[width];

    const upd=()=>{ go.disabled=!inp.value.trim(); }; upd(); inp.oninput=upd;
    f.onsubmit=e=>{ e.preventDefault(); const v=inp.value.trim(); if(!v) return; startRun(v); next(); };
    $('#log').innerHTML='&nbsp;'; idlePanel(); updScore(); if(!S.player) inp.focus({preventScroll:true}); return; }
  const b=document.createElement('button'); b.className='startbtn'; b.id='start'; b.type='button'; b.textContent=REC?`Продолжить · ${RUN.hands.length}/${PROF_N}`:'Начать раздачу'; b.onclick=next; t.appendChild(b);
  if(REC){ const w=document.createElement('div'); w.className='whoon'; w.innerHTML=`Играет: <span></span> · <button class="linkbtn" id="newrun" type="button">начать заново</button>`; w.querySelector('span').textContent=RUN.name; w.querySelector('#newrun').onclick=()=>{ RUN=null; idle(); }; t.appendChild(w); }
  $('#log').innerHTML='&nbsp;'; idlePanel(); b.focus({preventScroll:true});
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if(document.getElementById('app').hidden) return;
  const k=e.key.toLowerCase();
  const sh=document.getElementById('sheet'); if(sh){ if(k==='escape'||k==='enter'){ e.preventDefault(); sh.remove(); } return; }
  if(ANIM||BACK) return;
  if(IDLE){ if(k==='enter'||k===' '){ e.preventDefault(); const sb=document.getElementById('start'); if(sb) sb.click(); else next(); } return; }
  if(H.over){ if(k==='enter'||k===' '){ e.preventDefault(); next(); } return; }
  if(k==='f'||k==='а') heroAct('F');
  else if(k==='x'||k==='ч') heroAct('X');
  else if(k==='c'||k==='с') heroAct('C');
  else if(k==='r'||k==='к') heroAct('R',amount);
});

const HELP_HTML=`
<h3>Что это</h3>
<p>Тренажёр под нашу домашнюю игру: блайнды 2-4, стеки 500 (125 ББ), без рейка и анте, стол на 8–10 игроков. Все решения за тобой.</p>
<h3>Режимы игры</h3>
<ul>
<li><b>Префлоп</b> — раздача играется до флопа, разбор только префлоп-решений.</li>
<li><b>Полная раздача</b> — раздача идёт до вскрытия: флоп, тёрн, ривер. Соперники за столом играют по модели (ниже), разбор по шагам на каждой улице. В индивидуальном режиме друзья играют постфлоп по своим профилям: станции коллируют шире и почти не блефуют, Зак ставит сам, когда попал, Тёма играет прямо и без чек-рейзов, Катя ставит непредсказуемым размером, Коля и Маша ставят почти только за вэлью. Правильный ответ учитывает эксплойты: против станций без блефов и добор крупнее, против нитов добор только сильными руками, а эквити считается против диапазона, суженного по профилю.</li>
</ul>
<h3>Как играть</h3>
<ul>
<li>Фолд, Чек, Колл или Рейз. Чек доступен, только когда ставить нечего; колл первым в банк — это лимп.</li>
<li>Размер рейза задаётся полем под кнопками: это сумма всей ставки («рейз до»). Есть − и +, ползунок и быстрые размеры.</li>
<li>Если тебе ответили рейзом (3-бет, 4-бет, олл-ин), решение снова за тобой.</li>
<li>Клавиши на компьютере: F фолд, X чек, C колл, R рейз выбранным размером, Enter — следующая раздача, Esc — закрыть окно.</li>
<li>Фильтры сверху выбирают, с какой позиции тебе сдают: ранние, средние, поздние, блайнды.</li>
</ul>
<h3>Режимы</h3>
<ul>
<li><b>GTO</b> — соперники безымянные и играют по GTO-диапазонам; правильный ответ тоже GTO.</li>
<li><b>Индивидуальный</b> (временно закрыт) — за столом друзья из документа стратегии (Зак, Тёма, Катя, Коля, Лина, Наташа, Маша), недостающие места занимают профили Station, Fish, Nit, Reg. Рассадка новая каждую раздачу. Соперники играют по своим профилям (лимпы, размеры, 3-беты), а правильный ответ учитывает эксплойты из документа: опены под домашнюю игру (с ранних позиций меньше офсьютных бродвеев и больше одномастных рук и мелких пар, с поздних против лузовых блайндов меньше офсьютного мусора), изоляция лимперов, крупный опен против станций в блайндах, 3-бет за вэлью против фишей, уважение к 3-бету станции.</li>
</ul>
<h3>Разбор</h3>
<ul>
<li>После раздачи по каждому твоему решению: оценка (верно, неточный размер, ошибка), ответ по GTO или по эксплойту, объяснение и сетка 13×13 со всем диапазоном спота. Твоя рука обведена.</li>
<li>Пограничные руки солвер играет миксом — там верны оба действия.</li>
<li>Размер оценивается отдельно: верное действие с плохим размером засчитывается наполовину.</li>
</ul>
<h3>Диапазоны «+»</h3>
<p>Кнопка «+» на картах (твоих и соперников, которые вошли в банк) показывает диапазон всей линии игрока — например, «рейз 14 → колл 3-бета» с учётом обоих решений. Яркие клетки играют так всегда, бледные — иногда.</p>
<h3>Эквити</h3>
<p>Над твоими картами — эквити твоей руки против диапазонов соперников по их линии, над картами соперника — эквити его диапазона против твоей руки. Под столом для сравнения эквити против их конкретных рук. Считается симуляцией на 10–12 тысяч раскладов, погрешность около полупроцента.</p>
<h3>Полная раздача: как оценивается постфлоп</h3>
<ul>
<li>Солвер в браузере не запустить, поэтому постфлоп считает упрощённая модель. Для каждой руки диапазона считается эквити против диапазонов соперников, суженных их действиями.</li>
<li>Без ставки: ставим за вэлью, если эквити выше порога улицы (на флопе ≈ 58–64%, на тёрне ≈ 64%, на ривере ≈ 68% против одного соперника), плюс часть слабых рук идёт в блеф в пропорции к размеру ставки. Остальное — чек. Без позиции против агрессора прошлой улицы модель чекает.</li>
<li>Против ставки: колл, если эквити не ниже шансов банка (на флопе и тёрне с небольшой поправкой на следующие улицы), рейз с очень сильными руками, иначе фолд.</li>
<li>Размеры: ставка 1/3 банка на флопе (1/2 в мультипоте), 2/3 на тёрне, 3/4 на ривере; рейз ×3. Решения около порога засчитываются в обе стороны.</li>
<li>Эквити считается симуляцией, погрешность 1–2%. В разборе на каждом шаге: борд, банк, нужное и твоё эквити, ответ модели и сетка диапазона соперника на этот момент.</li>
</ul>
<h3>Профиль</h3>
<p>Режим для составления профиля игрока. Перед началом вводится имя, дальше 50 префлоп-раздач без подсказок. Соперники играют по GTO-чартам, без лимпов. Раздача подстраивается под игрока: сначала тренажёр считает его лузовым и сдаёт руки на краю широкого диапазона, а дальше после каждой раздачи сдвигает этот край к тому, как человек играет на самом деле (часть рук всегда на краю правильного диапазона). Оценка решений по GTO-чартам. Явные фолды и явные рейзы приходят реже, но сами карты честно сдаются из перемешанной колоды. В конце показываются тип игрока (нит, TAG, LAG, фиш, колл-стейшн, маньяк), главные ошибки с советами и таблица раздач. Любую раздачу можно развернуть и посмотреть полный разбор. Тип игрока считается относительно правильной игры на тех же руках: например, «вошёл в 30% банков, а правильно было в 18%» значит лузовый. Решения сохраняются под именем игрока.</p>
<h3>Статистика</h3>
<p>Точность по типам решений и позициям, последние ошибки. Хранится в этом браузере, на каждом устройстве своя.</p>
<h3>Оговорки</h3>
<ul>
<li>Диапазоны — упрощённые GTO-чарты для 9-max кэша на 100–125 ББ без рейка, не выгрузка из солвера.</li>
<li>Все карты, руки игроков и все пять карт борда, сдаются из перемешанной колоды в начале раздачи и дальше не меняются. Тренажёр только чаще пропускает раздачи, где тебе сразу пришёл бы очевидный фолд.</li>
</ul>`;

async function api(action,data){
  if(!ENDPOINT) throw new Error('no endpoint');
  const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data))});
  return r.json();
}
const AERR={login_format:'Логин: от 2 до 24 символов, буквы, цифры, пробел, точка, дефис или подчёркивание.',password_format:'Пароль: не короче 4 символов.',login_taken:'Такой логин уже занят.',bad_credentials:'Неверный логин или пароль.',too_many:'Слишком много попыток. Подожди 15 минут.',auth:'Вход устарел, войди заново.'};

let ABUSY=false;
async function authSubmit(action){
  if(ABUSY) return; const login=$('#alogin').value.trim(), password=$('#apass').value; if(!login||!password) return;
  ABUSY=true; const btn=action==='register'?$('#abtn-reg'):$('#abtn-login'), txt=btn.textContent; btn.disabled=true; btn.textContent='Подождите…'; $('#autherr').textContent='';
  try{ const r=await api(action,{login,password});
    if(r&&r.ok){ AUTH={token:r.token,login:r.login}; try{ localStorage.setItem(AKEY,JSON.stringify(AUTH)); }catch(e){} $('#apass').value=''; showApp(); }

  catch(e){ $('#autherr').textContent='Нет связи с сервером. Проверь интернет и попробуй ещё раз.'; }
